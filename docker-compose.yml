services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meridian_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  compute:
    build: .
    volumes:
      - bronze_data:/data/bronze
    networks:
      - meridian_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  bronze_data:

networks:
  meridian_network:
    driver: bridge